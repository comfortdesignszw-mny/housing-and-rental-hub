<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background 3D Radial & Linear Gradients -->
    <radialGradient id="bgLight" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- 3D Bevel Top-Left Rim Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3D Roof Left Lit Slope -->
    <linearGradient id="roofLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 3D Roof Right Shaded Slope -->
    <linearGradient id="roofShaded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 3D Roof Fascia Under-Eaves Extrusion -->
    <linearGradient id="roofFascia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- 3D House Body Stucco Shading -->
    <linearGradient id="wallLit" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="wallExtrude" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 3D Chimney Gradients -->
    <linearGradient id="chimneyFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="chimneySide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- 3D Door Arch Gradients -->
    <linearGradient id="doorInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="30%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 3D Window Glass Gradients -->
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- 3D Gold Emblem Gradients -->
    <radialGradient id="goldSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Filters for Depth, Specular Highlights & Ambient Occlusion -->
    <filter id="tileExtrusion" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#011f18" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022c22" flood-opacity="0.4" />
    </filter>

    <filter id="houseExtrusion" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022c22" flood-opacity="0.3" />
    </filter>

    <filter id="roofGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350f" flood-opacity="0.45" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Base Tile with Drop Shadow -->
  <g filter="url(#tileExtrusion)">
    <!-- Base Rounded Squircle with 3D Radial Fill -->
    <rect width="512" height="512" rx="108" fill="url(#bgLight)" />
    
    <!-- 3D Surface Curved Sheen (Top-Left Spherical Ambient Light) -->
    <path d="M 0 108 C 0 48.37 48.37 0 108 0 L 404 0 C 463.63 0 512 48.37 512 108 L 512 256 C 410 230 180 230 0 350 Z" fill="#ffffff" opacity="0.07" />

    <!-- 3D Inner Bevel Rim Border -->
    <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="url(#bevelLight)" stroke-width="4.5" />
    <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2" />
  </g>

  <!-- 3D Embossed Zimbabwe Chevron Geometric Patterns -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Groove Shadows -->
    <path d="M 0 102 L 256 222 L 512 102" stroke="#022c22" stroke-width="6" opacity="0.4" />
    <path d="M 0 182 L 256 302 L 512 182" stroke="#022c22" stroke-width="6" opacity="0.3" />
    <path d="M 0 262 L 256 382 L 512 262" stroke="#022c22" stroke-width="6" opacity="0.25" />
    <path d="M 0 342 L 256 462 L 512 342" stroke="#022c22" stroke-width="6" opacity="0.2" />

    <!-- Groove Highlights -->
    <path d="M 0 100 L 256 220 L 512 100" stroke="#34d399" stroke-width="4.5" opacity="0.35" />
    <path d="M 0 180 L 256 300 L 512 180" stroke="#34d399" stroke-width="4.5" opacity="0.25" />
    <path d="M 0 260 L 256 380 L 512 260" stroke="#34d399" stroke-width="4.5" opacity="0.2" />
    <path d="M 0 340 L 256 460 L 512 340" stroke="#34d399" stroke-width="4.5" opacity="0.15" />
  </g>

  <!-- Main House & Emblem in 3D -->
  <g filter="url(#houseExtrusion)">
    
    <!-- 3D Chimney Block -->
    <!-- Chimney Cast Shadow -->
    <path d="M 325 150 L 370 190 L 357 195 Z" fill="#78350f" opacity="0.6" />
    <!-- Chimney Left Lit Facet -->
    <rect x="325" y="130" width="22" height="62" rx="4" fill="url(#chimneyFront)" />
    <!-- Chimney Right Shaded Facet -->
    <rect x="347" y="130" width="10" height="62" rx="3" fill="url(#chimneySide)" />
    <!-- Chimney 3D Cap / Flue Inset -->
    <ellipse cx="341" cy="130" rx="16" ry="5" fill="#fef08a" />
    <ellipse cx="341" cy="130" rx="11" ry="3.5" fill="#78350f" />

    <!-- 3D House Body -->
    <!-- Extruded House Foundation Bottom Thickness -->
    <path d="M 135 395 C 135 410 147 426 162 426 L 350 426 C 365 426 377 410 377 395 L 377 420 C 377 435 365 447 350 447 L 162 447 C 147 447 135 435 135 420 Z" fill="#94a3b8" opacity="0.8" />

    <!-- House Main Wall Surface -->
    <path d="M 135 240 L 135 395 C 135 410 147 422 162 422 L 350 422 C 365 422 377 410 377 395 L 377 240 L 256 135 Z" fill="url(#wallLit)" />
    
    <!-- Right Wall 3D Ambient Edge Shadow -->
    <path d="M 362 240 L 362 395 C 362 408 370 418 377 418 L 377 240 Z" fill="#cbd5e1" opacity="0.6" />

    <!-- Top Wall Eaves Shadow Cast by Roof -->
    <path d="M 135 240 L 256 138 L 377 240 L 377 252 L 256 150 L 135 252 Z" fill="#78350f" opacity="0.22" />

    <!-- 3D Arched Doorway (Recessed with Inset Depth) -->
    <!-- Door Outer Bevel Molding Frame -->
    <path d="M 216 422 L 216 313 C 216 291 234 274 256 274 C 278 274 296 291 296 313 L 296 422 Z" fill="#e2e8f0" />
    <!-- Door Recessed Inset Shadow -->
    <path d="M 218 422 L 218 314 C 218 293 235 277 256 277 C 277 277 294 293 294 314 L 294 422 Z" fill="#022c22" />
    <!-- Door Main Emerald Leaf -->
    <path d="M 221 422 L 221 316 C 221 296 237 280 256 280 C 275 280 291 296 291 316 L 291 422 Z" fill="url(#doorInner)" />
    <!-- 3D Door Arch Inner Highlight Rim -->
    <path d="M 223 422 L 223 318 C 223 299 238 283 256 283" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6" />
    <!-- Door Vertical Dividing Bevel Line -->
    <line x1="256" y1="290" x2="256" y2="422" stroke="#022c22" stroke-width="2.5" />
    <line x1="257" y1="290" x2="257" y2="422" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
    <!-- 3D Spherical Brass Doorknob with Specular Highlight -->
    <circle cx="283" cy="365" r="4.5" fill="#78350f" />
    <circle cx="282" cy="364" r="4.5" fill="url(#goldSphere)" />
    <circle cx="280.5" cy="362.5" r="1.5" fill="#ffffff" />

    <!-- 3D Left Window -->
    <!-- Window Outer Recessed Frame -->
    <rect x="166" y="273" width="38" height="46" rx="7" fill="#cbd5e1" />
    <rect x="167" y="274" width="36" height="44" rx="6" fill="#0f172a" opacity="0.3" />
    <!-- Window Glass -->
    <rect x="168" y="275" width="34" height="42" rx="5" fill="url(#windowGlass)" />
    <!-- Window Glass Diagonal 3D Specular Glare -->
    <path d="M 168 275 L 195 275 L 168 305 Z" fill="#ffffff" opacity="0.55" />
    <path d="M 180 275 L 202 275 L 168 315 L 168 305 Z" fill="#ffffff" opacity="0.25" />
    <!-- 3D Raised Mullions / Crossbars -->
    <line x1="185" y1="275" x2="185" y2="317" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="186" y1="275" x2="186" y2="317" stroke="#0369a1" stroke-width="1.2" opacity="0.7" />
    <line x1="168" y1="296" x2="202" y2="296" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="168" y1="297" x2="202" y2="297" stroke="#0369a1" stroke-width="1.2" opacity="0.7" />

    <!-- 3D Right Window -->
    <!-- Window Outer Recessed Frame -->
    <rect x="308" y="273" width="38" height="46" rx="7" fill="#cbd5e1" />
    <rect x="309" y="274" width="36" height="44" rx="6" fill="#0f172a" opacity="0.3" />
    <!-- Window Glass -->
    <rect x="310" y="275" width="34" height="42" rx="5" fill="url(#windowGlass)" />
    <!-- Window Glass Diagonal 3D Specular Glare -->
    <path d="M 310 275 L 337 275 L 310 305 Z" fill="#ffffff" opacity="0.55" />
    <path d="M 322 275 L 344 275 L 310 315 L 310 305 Z" fill="#ffffff" opacity="0.25" />
    <!-- 3D Raised Mullions / Crossbars -->
    <line x1="327" y1="275" x2="327" y2="317" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="328" y1="275" x2="328" y2="317" stroke="#0369a1" stroke-width="1.2" opacity="0.7" />
    <line x1="310" y1="296" x2="344" y2="296" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="310" y1="297" x2="344" y2="297" stroke="#0369a1" stroke-width="1.2" opacity="0.7" />

    <!-- 3D Golden Medallion / Key Emblem in Center -->
    <g filter="url(#roofGlow)">
      <!-- Outer Cast Shadow -->
      <circle cx="256" cy="237" r="20" fill="#022c22" opacity="0.4" />
      <!-- Outer 3D Beveled Ring -->
      <circle cx="256" cy="235" r="19" fill="url(#goldRim)" />
      <circle cx="256" cy="235" r="16.5" fill="url(#goldSphere)" />
      <!-- Specular Crest -->
      <path d="M 242 225 C 248 219 264 219 270 225 C 263 226 248 226 242 225 Z" fill="#ffffff" opacity="0.8" />
      <!-- Inner Hole with Inset Shadow -->
      <circle cx="256" cy="235" r="8.5" fill="#78350f" opacity="0.7" />
      <circle cx="256" cy="235" r="7.5" fill="#ffffff" />
      <circle cx="256" cy="235" r="5" fill="#f8fafc" />
    </g>

    <!-- 3D Dimensional Roof & Overhang Gable -->
    <g filter="url(#roofGlow)">
      <!-- Under-Eaves 3D Extrusion Fascia Board -->
      <path d="M 256 102 L 105 232 C 99 237 99 246 105 252 L 123 268 C 128 272 137 272 142 267 L 256 168 L 370 267 C 375 272 384 272 389 268 L 407 252 C 413 246 413 237 407 232 Z" fill="url(#roofFascia)" />

      <!-- Left Lit 3D Slope -->
      <path d="M 256 95 L 105 225 C 100 230 100 238 106 243 L 125 259 C 130 263 138 263 143 258 L 256 160 Z" fill="url(#roofLit)" />

      <!-- Right Shaded 3D Slope -->
      <path d="M 256 95 L 256 160 L 369 258 C 374 263 382 263 387 259 L 406 243 C 412 238 412 230 407 225 Z" fill="url(#roofShaded)" />

      <!-- 3D Apex Ridge Highlight Line -->
      <line x1="256" y1="95" x2="256" y2="160" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
      
      <!-- Top Slope Edge Specular Light Rim -->
      <path d="M 256 95 L 108 223" stroke="#fffbeb" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 256 95 L 404 223" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- 3D Beacon Star / Offline Beacon Pulse -->
    <!-- Star Ambient Lens Aura -->
    <circle cx="256" cy="91" r="28" fill="#fbbf24" opacity="0.25" filter="url(#starGlow)" />
    
    <!-- 3D Faceted Star (Chiseled Light & Dark Facets) -->
    <!-- Star Center Drop Shadow -->
    <polygon points="256,72 262,86 278,88 266,99 270,115 256,106 242,115 246,99 234,88 250,86" fill="#78350f" opacity="0.4" />
    
    <!-- Star Facets Group -->
    <g>
      <!-- Point 1: Top -->
      <polygon points="256,70 256,92 250,84" fill="#fef08a" />
      <polygon points="256,70 256,92 262,84" fill="#f59e0b" />
      <!-- Point 2: Top Right -->
      <polygon points="278,86 256,92 262,84" fill="#fef08a" />
      <polygon points="278,86 256,92 266,97" fill="#d97706" />
      <!-- Point 3: Bottom Right -->
      <polygon points="270,113 256,92 266,97" fill="#f59e0b" />
      <polygon points="270,113 256,92 256,104" fill="#b45309" />
      <!-- Point 4: Bottom Left -->
      <polygon points="242,113 256,92 256,104" fill="#fbbf24" />
      <polygon points="242,113 256,92 246,97" fill="#d97706" />
      <!-- Point 5: Top Left -->
      <polygon points="234,86 256,92 246,97" fill="#fde047" />
      <polygon points="234,86 256,92 250,84" fill="#f59e0b" />
      <!-- Star Center Sparkle Highlight -->
      <circle cx="256" cy="92" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
